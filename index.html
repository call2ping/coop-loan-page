<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>โครงการเงินกู้ – สหกรณ์ออมทรัพย์ บวท.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0f1c3f; --bg2:#16284f;
    --panel:#ffffff; --ink:#1b2640; --muted:#6b7896;
    --line:#e6eaf2; --soft:#f4f7fc;
    --brand:#1f5fd1; --brand-d:#16408f; --accent:#0fb98a;
    --gold:#f0a429; --pink:#e05a7a; --purple:#7b59d6;
    --radius:16px; --shadow:0 8px 28px rgba(20,40,90,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Sarabun',system-ui,sans-serif;
    color:var(--ink); background:var(--soft);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}

  /* header */
  header.top{
    background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 60%,#1d3a78 100%);
    color:#fff; padding:30px 20px 26px;
  }
  .wrap{max-width:1200px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:16px}
  .logo{flex:none;width:74px;height:74px;border-radius:50%;background:#fff;
    display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:6px}
  .logo img{width:100%;height:100%;object-fit:contain;display:block}
  .top h1{margin:0;font-size:30px;font-weight:800;letter-spacing:.2px}
  .top p{margin:6px 0 0;color:#b9c8ec;font-size:15px}
  .top .sub{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:#cdd9f3}
  .top .sub b{color:#fff}

  /* controls */
  .controls{max-width:1200px;margin:-22px auto 0;padding:0 20px}
  .panel{
    background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;
  }
  .searchrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .search{flex:1;min-width:220px;position:relative}
  .search input{
    width:100%;padding:13px 14px 13px 42px;border:1px solid var(--line);
    border-radius:11px;font-size:15px;font-family:inherit;background:var(--soft);
  }
  .search input:focus{outline:2px solid #bcd2f6;background:#fff}
  .search svg{position:absolute;left:13px;top:13px;color:var(--muted)}
  .sortsel select{
    padding:12px 14px;border:1px solid var(--line);border-radius:11px;
    font-family:inherit;font-size:14px;background:#fff;color:var(--ink)
  }

  .filters{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:18px}
  .fgroup{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
  .fgroup h4{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:7px 12px;border-radius:999px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.15s;user-select:none;white-space:nowrap
  }
  .chip:hover{border-color:#9dbdf0}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .rangeval{font-size:14px;font-weight:700;color:var(--brand-d);margin-bottom:6px}
  input[type=range]{width:100%;accent-color:var(--brand);cursor:pointer}
  .twolabels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px}

  .filterfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:10px}
  .count{font-size:14px;color:var(--muted)}
  .count b{color:var(--ink);font-size:16px}
  .reset{background:none;border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-family:inherit;font-size:13px;color:var(--muted);cursor:pointer}
  .reset:hover{color:var(--pink);border-color:var(--pink)}

  /* grid */
  .grid{max-width:1200px;margin:22px auto 60px;padding:0 20px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:0;overflow:hidden;cursor:pointer;
    display:flex;flex-direction:column;transition:.18s;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(20,40,90,.16);border-color:#cdd9f3}
  .card .head{padding:16px 16px 12px;border-bottom:1px solid var(--line);position:relative}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:9px}
  .b-สามัญ{background:#e7f0ff;color:var(--brand-d)}
  .b-พิเศษ{background:#efe7ff;color:#5a37b8}
  .b-ฉุกเฉิน{background:#ffe9ee;color:#c13357}
  .flag{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;margin:0 0 9px 5px;white-space:nowrap}
  .flag.new{background:linear-gradient(135deg,#ff4f7b,#e0306a);color:#fff;letter-spacing:.6px;box-shadow:0 2px 8px rgba(224,48,106,.35)}
  .flag.inc{background:linear-gradient(135deg,#14b8a6,#0b8a80);color:#fff;letter-spacing:.4px;box-shadow:0 2px 8px rgba(11,138,128,.3)}
  .flag.soon{background:#fff1dc;color:#b45d00;border:1px solid #f6c77a;padding:2px 8px}
  .flag.over{background:#eceff4;color:#6b7896}
  .card.expired{opacity:.6}
  .card h3{margin:0;font-size:17px;font-weight:700;line-height:1.35}
  .card .rate{position:absolute;top:14px;right:16px;text-align:right}
  .card .rate .n{font-size:22px;font-weight:800;color:var(--accent);line-height:1}
  .card .rate .u{font-size:11px;color:var(--muted)}
  .card .body{padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
  .kv{display:flex;align-items:flex-start;gap:9px;font-size:13.5px}
  .kv .ic{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px}
  .kv .lab{color:var(--muted);min-width:74px}
  .kv .val{color:var(--ink);font-weight:600}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .tag{font-size:11px;background:var(--soft);border:1px solid var(--line);color:var(--muted);padding:3px 9px;border-radius:999px}
  .card .foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--soft)}
  .card .foot .more{font-size:13px;font-weight:700;color:var(--brand)}

  .empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted)}
  .empty svg{opacity:.4}

  /* modal */
  .ovl{position:fixed;inset:0;background:rgba(13,22,46,.55);backdrop-filter:blur(3px);
    display:none;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:50;overflow:auto}
  .ovl.show{display:flex}
  .modal{background:#fff;border-radius:20px;max-width:760px;width:100%;box-shadow:0 30px 70px rgba(0,0,0,.35);overflow:hidden;animation:pop .2s ease}
  @keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
  .mhead{padding:22px 24px;color:#fff;position:relative}
  .mhead.c-สามัญ{background:linear-gradient(135deg,#1f5fd1,#16408f)}
  .mhead.c-พิเศษ{background:linear-gradient(135deg,#7b59d6,#5128a8)}
  .mhead.c-ฉุกเฉิน{background:linear-gradient(135deg,#e05a7a,#b42c50)}
  .mhead h2{margin:0;font-size:23px;font-weight:800;padding-right:40px}
  .mhead .mb{display:inline-block;font-size:12px;background:rgba(255,255,255,.22);padding:3px 11px;border-radius:999px;margin-bottom:8px}
  .mhead .flag{margin-bottom:8px}
  .close{position:absolute;top:18px;right:18px;width:34px;height:34px;border:none;border-radius:9px;
    background:rgba(255,255,255,.2);color:#fff;font-size:20px;cursor:pointer;line-height:1}
  .close:hover{background:rgba(255,255,255,.35)}
  .mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-bottom:1px solid var(--line)}
  .mstat{padding:16px;text-align:center;border-right:1px solid var(--line)}
  .mstat:last-child{border-right:none}
  .mstat .n{font-size:21px;font-weight:800;color:var(--brand-d)}
  .mstat .l{font-size:12px;color:var(--muted);margin-top:2px}
  .mbody{padding:6px 24px 22px;max-height:54vh;overflow:auto}
  .sec{margin-top:18px}
  .sec h4{margin:0 0 9px;font-size:14px;font-weight:700;color:var(--brand-d);display:flex;align-items:center;gap:7px}
  .sec h4::before{content:"";width:4px;height:16px;background:var(--brand);border-radius:3px}
  .sec ul{margin:0;padding-left:2px;list-style:none;display:flex;flex-direction:column;gap:7px}
  .sec li{font-size:14px;line-height:1.5;display:flex;gap:9px;align-items:flex-start}
  .sec li::before{content:"●";color:var(--accent);font-size:9px;margin-top:6px;flex:none}
  .drow{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .drow .k{color:var(--muted)}
  .drow .v{font-weight:600;text-align:right}
  .mfoot{padding:16px 24px;border-top:1px solid var(--line);background:var(--soft);display:flex;gap:10px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:11px;font-family:inherit;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;border:none}
  .btn.pri{background:var(--brand);color:#fff}
  .btn.pri:hover{background:var(--brand-d)}
  .btn.sec{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn.sec:hover{border-color:#9dbdf0}

  @media(max-width:820px){
    .filters{grid-template-columns:repeat(2,1fr)}
    .mstats{grid-template-columns:repeat(3,1fr)}
  }
  @media(max-width:540px){
    .top h1{font-size:24px}
    .filters{grid-template-columns:1fr}
    .grid{grid-template-columns:1fr}
    .mstat .n{font-size:18px}
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <span class="logo"><img src="logo.png" alt="ตราสหกรณ์ออมทรัพย์ บวท." /></span>
      <div>
        <h1>โครงการเงินกู้</h1>
        <p>สหกรณ์ออมทรัพย์บริษัท วิทยุการบินแห่งประเทศไทย จำกัด — เปรียบเทียบและกรองโครงการเงินกู้ได้ในที่เดียว</p>
      </div>
    </div>
    <div class="sub">
      <span><b id="totCount">0</b> โครงการ</span>
      <span>ดอกเบี้ยต่ำสุด <b id="minRate">–</b></span>
      <span>วงเงินสูงสุด <b id="maxAmt">–</b></span>
    </div>
  </div>
</header>

<div class="controls">
  <div class="panel">
    <div class="searchrow">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="text" placeholder="ค้นหาชื่อโครงการ เช่น เคหะ, รถยนต์, ฉุกเฉิน…" />
      </div>
      <div class="sortsel">
        <select id="sort">
          <option value="newest">เรียง: โครงการใหม่ล่าสุด</option>
          <option value="rate">ดอกเบี้ยต่ำ→สูง</option>
          <option value="rateDesc">ดอกเบี้ยสูง→ต่ำ</option>
          <option value="amtDesc">วงเงินมาก→น้อย</option>
          <option value="termDesc">ผ่อนนานสุด</option>
          <option value="name">ชื่อโครงการ</option>
        </select>
      </div>
    </div>

    <div class="filters">
      <div class="fgroup">
        <h4>ประเภทเงินกู้</h4>
        <div class="chips" id="catChips"></div>
      </div>
      <div class="fgroup">
        <h4>หลักประกัน / คนค้ำ</h4>
        <div class="chips" id="guarChips"></div>
      </div>
      <div class="fgroup">
        <h4>อัตราดอกเบี้ยสูงสุด</h4>
        <div class="rangeval"><span id="rateLbl">ทุกอัตรา</span></div>
        <input id="rate" type="range" min="2" max="7" step="0.05" value="7" />
        <div class="twolabels"><span>2%</span><span>7%</span></div>
      </div>
      <div class="fgroup">
        <h4>วงเงินที่ต้องการ</h4>
        <div class="rangeval"><span id="amtLbl">ทุกวงเงิน</span></div>
        <input id="amt" type="range" min="0" max="10000000" step="100000" value="0" />
        <div class="twolabels"><span>0</span><span>10 ล้าน</span></div>
      </div>
    </div>

    <div class="filterfoot">
      <div class="count">พบ <b id="shown">0</b> โครงการ</div>
      <button class="reset" id="reset">↺ ล้างตัวกรอง</button>
    </div>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="ovl" id="ovl">
  <div class="modal" id="modal"></div>
</div>

// ---------- helpers ----------
const baht = n => n>=1000000 ? (n/1000000).toLocaleString('th-TH',{maximumFractionDigits:2})+' ล้าน' : n.toLocaleString('th-TH');
const $ = s => document.querySelector(s);

const state = { q:"", cats:new Set(), guars:new Set(), rate:7, amt:0, sort:"newest" };

// ---------- ระยะเวลาโครงการ (start/end = วันที่ ค.ศ. ตามประกาศ) ----------
const DAY = 86400000, NEW_DAYS = 30, SOON_DAYS = 30;
let today = new Date(); today.setHours(0,0,0,0);
const toDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const thDate = s => toDate(s).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'});
function period(d){
  if(!d.start) return {};
  const sinceStart = Math.round((today - toDate(d.start))/DAY);
  const left = Math.round((toDate(d.end) - today)/DAY);
  return {
    upcoming: sinceStart<0,                                  // ประกาศแล้วแต่ยังไม่ถึงวันเริ่ม
    isNew: left>=0 && sinceStart>=0 && sinceStart<=NEW_DAYS, // เริ่มมาไม่เกิน 30 วัน
    soon: left>=0 && left<=SOON_DAYS,
    expired: left<0, left
  };
}
function flags(d){
  const p = period(d);
  return (p.upcoming ? `<span class="flag inc">🔜 INCOMING · ${toDate(d.start).toLocaleDateString('th-TH',{day:'numeric',month:'short'})}</span>` : '')
       + (p.isNew ? '<span class="flag new">✨ NEW</span>' : '')
       + (p.soon ? `<span class="flag soon">⏳ ${p.left ? 'เหลือ '+p.left+' วัน' : 'วันสุดท้าย'}</span>` : '')
       + (p.expired ? '<span class="flag over">หมดเขตแล้ว</span>' : '');
}

const CATS = ["สามัญ","พิเศษ","ฉุกเฉิน"];
const GUARS = ["ไม่ต้องค้ำ","บุคคลค้ำ","หุ้น/เงินฝากค้ำ","อสังหาฯ ค้ำ"];

// header stats
$("#totCount").textContent = DATA.length;
$("#minRate").textContent = Math.min(...DATA.map(d=>d.rate)).toFixed(2)+"%";
$("#maxAmt").textContent = baht(Math.max(...DATA.filter(d=>d.amount).map(d=>d.amount)))+" บาท";

// build chips
function buildChips(el, items, set){
  el.innerHTML="";
  items.forEach(it=>{
    const c=document.createElement("button");
    c.className="chip"; c.textContent=it;
    c.onclick=()=>{ set.has(it)?set.delete(it):set.add(it); c.classList.toggle("on"); render(); };
    el.appendChild(c);
  });
}
buildChips($("#catChips"), CATS, state.cats);
buildChips($("#guarChips"), GUARS, state.guars);

// listeners
$("#q").oninput = e=>{ state.q=e.target.value.trim().toLowerCase(); render(); };
$("#sort").onchange = e=>{ state.sort=e.target.value; render(); };
$("#rate").oninput = e=>{
  state.rate=parseFloat(e.target.value);
  $("#rateLbl").textContent = state.rate>=7 ? "ทุกอัตรา" : "ไม่เกิน "+state.rate.toFixed(2)+"%";
  render();
};
$("#amt").oninput = e=>{
  state.amt=parseInt(e.target.value);
  $("#amtLbl").textContent = state.amt<=0 ? "ทุกวงเงิน" : "ตั้งแต่ "+baht(state.amt)+" บาท";
  render();
};
$("#reset").onclick = ()=>{
  state.q=""; state.cats.clear(); state.guars.clear(); state.rate=7; state.amt=0; state.sort="newest";
  $("#q").value=""; $("#sort").value="newest"; $("#rate").value=7; $("#amt").value=0;
  $("#rateLbl").textContent="ทุกอัตรา"; $("#amtLbl").textContent="ทุกวงเงิน";
  document.querySelectorAll(".chip.on").forEach(c=>c.classList.remove("on"));
  render();
};

// filter + sort
function getList(){
  let list = DATA.filter(d=>{
    if(state.q && !(d.name.toLowerCase().includes(state.q) || d.cat.includes(state.q))) return false;
    if(state.cats.size && !state.cats.has(d.cat)) return false;
    if(state.guars.size && !d.guar.some(g=>state.guars.has(g))) return false;
    if(state.rate<7 && !(d.rate<=state.rate)) return false;
    if(state.amt>0){ if(d.amount!==null && d.amount<state.amt) return false; } // null = วงเงินยืดหยุ่น
    return true;
  });
  const s=state.sort;
  list.sort((a,b)=>{
    if(s==="newest"){ // วันเริ่มใหม่สุดก่อน → โครงการไม่มีกำหนดเวลา → หมดเขตแล้วไว้ล่างสุด
      const ex = (period(a).expired?1:0) - (period(b).expired?1:0); if(ex) return ex;
      const sa = a.start||"", sb = b.start||"";
      return sa!==sb ? sb.localeCompare(sa) : a.rate-b.rate;
    }
    if(s==="rate") return a.rate-b.rate;
    if(s==="rateDesc") return b.rate-a.rate;
    if(s==="amtDesc") return (b.amount||0)-(a.amount||0);
    if(s==="termDesc") return (b.term||0)-(a.term||0);
    if(s==="name") return a.name.localeCompare(b.name,'th');
    return 0;
  });
  return list;
}

const ICON = {
  rate:'%', amt:'฿', term:'⏱', guar:'👥', col:'🛡'
};

function render(){
  const list=getList();
  $("#shown").textContent=list.length;
  const grid=$("#grid");
  if(!list.length){
    grid.innerHTML='<div class="empty"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><p>ไม่พบโครงการที่ตรงกับเงื่อนไข<br>ลองปรับตัวกรองหรือกด “ล้างตัวกรอง”</p></div>';
    return;
  }
  grid.innerHTML = list.map(d=>`
    <div class="card${period(d).expired?' expired':''}" onclick="openModal('${d.id}')">
      <div class="head">
        <span class="badge b-${d.cat}">${d.cat}</span>${flags(d)}
        <div class="rate"><div class="n">${d.variable?'~'+d.rate.toFixed(2):d.rate.toFixed(2)}%</div><div class="u">ต่อปี</div></div>
        <h3>${d.name}</h3>
      </div>
      <div class="body">
        <div class="kv"><span class="ic" style="background:#e7f0ff">${ICON.amt}</span><span class="lab">วงเงิน</span><span class="val">${d.amountText}</span></div>
        <div class="kv"><span class="ic" style="background:#e8f8f1">${ICON.term}</span><span class="lab">ผ่อนชำระ</span><span class="val">${d.termText}</span></div>
        <div class="kv"><span class="ic" style="background:#fef0e0">${ICON.guar}</span><span class="lab">หลักประกัน</span><span class="val">${d.collateral}</span></div>
        <div class="tags">${d.guar.map(g=>`<span class="tag">${g}</span>`).join("")}</div>
      </div>
      <div class="foot"><span style="font-size:12px;color:var(--muted)">ดอกเบี้ย ${d.rateText}</span><span class="more">ดูรายละเอียด →</span></div>
    </div>`).join("");
}

// modal
function openModal(id){
  const d=DATA.find(x=>x.id===id); if(!d) return;
  const m=$("#modal");
  m.innerHTML=`
    <div class="mhead c-${d.cat}">
      <span class="mb">${d.cat}</span>${flags(d)}
      <h2>${d.name}</h2>
      <button class="close" onclick="closeModal()">✕</button>
    </div>
    <div class="mstats">
      <div class="mstat"><div class="n">${d.variable?'~'+d.rate.toFixed(2):d.rate.toFixed(2)}%</div><div class="l">ดอกเบี้ยต่อปี</div></div>
      <div class="mstat"><div class="n">${d.amount?baht(d.amount):'ตามสิทธิ'}</div><div class="l">วงเงินสูงสุด</div></div>
      <div class="mstat"><div class="n">${d.term?d.term+' งวด':'พิเศษ'}</div><div class="l">ระยะผ่อนสูงสุด</div></div>
    </div>
    <div class="mbody">
      <div class="sec">
        <h4>ข้อมูลหลัก</h4>
        ${d.start?`<div class="drow"><span class="k">ระยะเวลาโครงการ</span><span class="v">${thDate(d.start)} – ${thDate(d.end)}</span></div>`:''}
        <div class="drow"><span class="k">อัตราดอกเบี้ย</span><span class="v">${d.rateText}</span></div>
        <div class="drow"><span class="k">วงเงินกู้</span><span class="v">${d.amountText}</span></div>
        <div class="drow"><span class="k">การผ่อนชำระ</span><span class="v">${d.termText}</span></div>
        <div class="drow"><span class="k">เงินเดือนคงเหลือ</span><span class="v">${d.residual}</span></div>
        <div class="drow"><span class="k">หลักประกัน</span><span class="v">${d.collateral}</span></div>
      </div>
      <div class="sec"><h4>จำนวนผู้ค้ำ / หลักประกัน</h4><ul>${d.guarDetail.map(x=>`<li>${x}</li>`).join("")}</ul></div>
      <div class="sec"><h4>เงื่อนไข</h4><ul>${d.conditions.map(x=>`<li>${x}</li>`).join("")}</ul></div>
      <div class="sec"><h4>เอกสารประกอบการกู้</h4><ul>${d.documents.map(x=>`<li>${x}</li>`).join("")}</ul></div>
    </div>
    <div class="mfoot">
      <a class="btn pri" href="${encodeURI(d.pdf)}" target="_blank" rel="noopener">📄 เปิดเอกสารตัวเต็ม (PDF)</a>
      <button class="btn sec" onclick="closeModal()">ปิด</button>
    </div>`;
  $("#ovl").classList.add("show");
  document.body.style.overflow="hidden";
}
function closeModal(){ $("#ovl").classList.remove("show"); document.body.style.overflow=""; }
$("#ovl").onclick = e=>{ if(e.target.id==="ovl") closeModal(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

render();
</script>
</body>
</html>
